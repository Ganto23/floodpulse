[project]
name = "urbanpulse-backend"
version = "0.1.0"
description = "UrbanPulse: alt-data spatial momentum engine (H3 + Tucker + zero-shot TSFM)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pandas>=2.2",
    "numpy>=1.26,<3",
    "scipy>=1.13",
    "tensorly>=0.9",
    "h3>=4.1",
    "requests>=2.32",
]

[project.optional-dependencies]
# Zero-shot transformer backends (auto-detected at runtime, in this order).
timesfm = ["torch>=2.2", "timesfm[torch] @ git+https://github.com/google-research/timesfm.git"]
chronos = ["torch>=2.2", "chronos-forecasting>=1.5"]
osm = ["osmnx>=2.0"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
